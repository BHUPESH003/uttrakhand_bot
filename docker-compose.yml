services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uttarakhand_bot
      POSTGRES_PASSWORD: uttarakhand_bot
      POSTGRES_DB: uttarakhand_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uttarakhand_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
